[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgereckon"
version = "0.1.0"
description = "The code-graph auditor: checks a code knowledge graph's call edges against execution traces from the repo's own test suite, stamps every edge VERIFIED / REFUTED / UNVERIFIABLE, and answers impact queries only over the verified subgraph."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["code-graph", "call-graph", "verification", "ai-agents", "static-analysis", "audit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
edgereckon = "edgereckon.cli:main"

[tool.setuptools]
packages = ["edgereckon"]
